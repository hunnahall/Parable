name: Cron

# Ingest only. Retention (auto-archive, purge-article-content,
# purge-unengaged-articles) runs via Supabase Cron instead — see
# supabase/cron.sql — since those are cheap DB-only queries with no
# reason to leave the Supabase stack.
#
# Vercel Hobby caps Serverless Function duration at 10s regardless of the
# maxDuration set in each route, no matter what triggers the request.
# ingest-feeds is not fast (per-item OpenAI translate/summarize calls, see
# its own file for the details), so this job builds and runs the app
# inside the runner and hits its own localhost — same route code, same
# `after()` semantics (needs a real request scope, which a bare script
# calling runIngest() directly would not have), but no Vercel function or
# its duration cap in the path at all.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start app and run ingest
        run: |
          npm run start &
          SERVER_PID=$!

          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/login -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "App did not become ready in time" >&2
            kill "$SERVER_PID"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 1800 \
            -H "x-cron-secret: $CRON_SECRET" \
            http://localhost:3000/api/ingest-feeds
          status=$?

          kill "$SERVER_PID"
          exit $status
